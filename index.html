<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my game</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <h1>PAPER ROCK SCISSOR</h1>
    <div class="choices">
        <div class="choice" id="paper">
            <img src="image of paper.jpg">
        </div>
        <div class="choice" id="rock">
            <img src="image of rock.jpg">
        </div>
        <div class ="choice" id="scissor">
            <img src="image of scissor.webp">
        </div>
    </div>
    <div class="score-board">
        <div class="score">
            <p id="user-score">0</p>
            <p>you</p>
        </div>
        <div class="score"><p id ="comp-score">0</p>
        <p>comp</p>
    </div>
    </div>
    <div class="msg-container"><p id ="msg">play your move</p></div>
</body>

</html>
